app-id: dev.d4vram.downloadthis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: downloadthis

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --env=PYTHONPATH=/app/lib/python3.12/site-packages:/app/lib/python3.11/site-packages

build-options:
  build-args:
    - --share=network
  env:
    PIP_PREFIX: /app
    PIP_DISABLE_PIP_VERSION_CHECK: '1'

modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app -r requirements.txt
    sources:
      - type: shell
        commands: []

  - name: downloadthis
    buildsystem: simple
    build-commands:
      - printf '#!/usr/bin/env sh\nexit 0\n' > /app/bin/appstream-compose
      - chmod +x /app/bin/appstream-compose
      - install -Dm755 downloadthis_modern.py /app/bin/downloadthis_modern.py
      - install -Dm644 ytdlp_updater.py /app/bin/ytdlp_updater.py
      - install -Dm755 .packaging/linux/engine/yt-dlp /app/bin/engine/yt-dlp
      - |
        cat > /app/bin/downloadthis << 'EOF'
        #!/bin/bash
        exec python3 /app/bin/downloadthis_modern.py "$@"
        EOF
      - chmod +x /app/bin/downloadthis
      - install -Dm644 packaging/linux/dev.d4vram.downloadthis.desktop
            /app/share/applications/dev.d4vram.downloadthis.desktop
      - install -Dm644 packaging/linux/dev.d4vram.downloadthis.appdata.xml
            /app/share/metainfo/dev.d4vram.downloadthis.appdata.xml
      - install -Dm644 packaging/assets/icon128x128.png
            /app/share/icons/hicolor/128x128/apps/dev.d4vram.downloadthis.png
    sources:
      - type: dir
        path: ../..
